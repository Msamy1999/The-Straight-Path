  <path d="M32 41.7V37.4" stroke="#F7F3EA" stroke-width="2.9" stroke-linecap="round" />
  <path d="M32 33.1V29.9" stroke="#F7F3EA" stroke-width="2.1" stroke-linecap="round" />
</svg>
