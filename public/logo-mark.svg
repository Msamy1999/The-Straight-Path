  <circle cx="32" cy="14.5" r="9.5" fill="#C8951E" opacity="0.12" />
  <circle cx="32" cy="14.5" r="5.6" fill="#C8951E" opacity="0.28" />
  <circle cx="32" cy="14.5" r="3.6" fill="#C8951E" />
  <circle cx="32" cy="14.5" r="1.7" fill="#FFFFFF" />

